name: Ejecutar Scraper Diario

on:
  schedule:
      - cron: '0 19 * * *' # 19:00 UTC es 2:00 PM en Lima, Perú
  workflow_dispatch: # Botón para correrlo manualmente cuando quieras

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Traer los archivos del repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Selenium
        run: pip install selenium

      - name: Crear el archivo fantasma de cookies
        run: echo '${{ secrets.GOOGLE_COOKIES }}' > cookies.json

      - name: Despertar al Clickeador Mágico
        run: python clicker.py

      - name: Subir captura de pantalla
        uses: actions/upload-artifact@v4
        if: always() # Para que suba la foto incluso si hay un error
        with:
          name: Evidencia-Colab
          path: captura_colab.png
